<!doctype html>
<html lang="es">
<head><meta charset="utf-8"></head>
<body>
<title>Cancionero de Guitarra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1513">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: una columna para el celular; barra de 4 pestañas abajo; el lector de canción ocupa la pantalla con sus controles en un dock inferior. */
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --sunk:#E9EDE8; --ink:#17201B; --muted:#5B6862; --line:#DCE2DC;
  --chord:#0B6A7E; --chord-bg:#E0EFF2; --warm:#8E5400; --warm-bg:#FAEED6; --now:#FFF4CC; --danger:#A8261C; --ok:#2E7D4F; --ok-bg:#E3F2E8;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --lyric:20px; --lh:1.25;
  --r:14px; --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201C; --sunk:#0A0F0D; --ink:#E6EEE8; --muted:#97A69E; --line:#273430;
  --chord:#7AD3E6; --chord-bg:#153139; --warm:#F2B955; --warm-bg:#3A2B10; --now:#1F2C26; --danger:#FF8A80; --ok:#7BD39C; --ok-bg:#15301F; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201C; --sunk:#0A0F0D; --ink:#E6EEE8; --muted:#97A69E; --line:#273430;
  --chord:#7AD3E6; --chord-bg:#153139; --warm:#F2B955; --warm-bg:#3A2B10; --now:#1F2C26; --danger:#FF8A80; --ok:#7BD39C; --ok-bg:#15301F; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button,a.btn,.pick,.opt{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
:focus-visible{outline:2px solid var(--chord);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
a{color:var(--chord)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- App shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) var(--gut-r) 8px var(--gut-l);display:flex;align-items:center;gap:10px}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topacts{display:flex;gap:8px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--sunk);display:inline-grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
main{flex:1;padding:4px var(--gut-r) calc(88px + env(safe-area-inset-bottom,0px)) var(--gut-l);max-width:860px;width:100%;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:4px var(--gut-r) calc(4px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:12px;color:var(--muted);border-radius:10px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--chord);font-weight:700}
.tabs button[aria-current="page"] svg{filter:drop-shadow(0 0 0 transparent)}
@media (min-width:700px){ .tabs{max-width:860px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:14px 14px 0 0} }

/* ---------- Controles comunes ---------- */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:16px}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--chord);border-color:var(--chord);color:#fff}
.btn.warm{background:var(--warm-bg);border-color:transparent;color:var(--warm)}
.btn.ghost{background:none;border-color:transparent}
.btn.small{min-height:36px;padding:5px 11px;font-size:14px}
.btn.big{min-height:52px;font-size:17px}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap;border:0}
.chip.key{background:var(--chord-bg);color:var(--chord);font-family:var(--f-mono)}
.chip.warm{background:var(--warm-bg);color:var(--warm)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.field input,.field select,.field textarea,textarea.box,input.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:16px;min-width:0;width:100%}
textarea{resize:vertical}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lead{font-size:15px;color:var(--muted);max-width:62ch;margin:0}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:18px 0 8px}
.sectionhead h2{font-size:20px}
.backrow{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.backrow h2{font-size:22px;flex:1;min-width:0}
.hub{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hubcard{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:118px}
.hubcard .ic{width:38px;height:38px;border-radius:11px;background:var(--chord-bg);color:var(--chord);display:grid;place-items:center}
.hubcard .ic svg{width:22px;height:22px}
.hubcard b{font-family:var(--f-display);font-size:17px}
.hubcard small{color:var(--muted);font-size:13px;line-height:1.3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){ .grid2{grid-template-columns:1fr} }

/* ---------- Biblioteca ---------- */
.libbar{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.grouphead{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px;font-family:var(--f-display);font-weight:700;font-size:18px}
.grouphead .count{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.songs{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.song{display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.song:first-child{border-top:0}
.song .t{font-weight:700;font-size:16px;line-height:1.25}
.song .a{font-size:13px;color:var(--muted)}
.song .meta{display:flex;gap:6px;align-items:center;flex:none}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.addmenu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addmenu .opt{flex-direction:column;align-items:flex-start;gap:4px;min-height:96px}

/* ---------- Lector ---------- */
#reader{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.rd-head{display:flex;align-items:center;gap:8px;padding:8px var(--gut-r) 8px var(--gut-l)}
.rd-title{flex:1;min-width:0}
.rd-title h2{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-title .a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-info{display:flex;gap:6px;flex-wrap:wrap;padding:4px var(--gut-r) 0 var(--gut-l)}
.rd-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:6px var(--gut-r) 0 var(--gut-l);position:relative}
.rd-body{max-width:760px;margin:0 auto;padding-bottom:65vh;font-size:var(--lyric);line-height:var(--lh)}
.sec{margin:0 0 1.05em}
.sec-label{font-family:var(--f-display);font-size:.62em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warm);margin:0 0 .25em}
.ln{position:relative;padding:.06em .3em .06em .4em;margin-left:-.4em;border-radius:6px;transition:background .25s}
.ln.now{background:var(--now)}
.ln .w{display:inline-block;white-space:nowrap;vertical-align:bottom}
.ln .w.nc .c{display:none}
.ln .p{display:inline-flex;flex-direction:column;vertical-align:bottom}
.ln .c{font-family:var(--f-mono);font-weight:700;font-size:.8em;color:var(--chord);min-height:1.2em;line-height:1.2;padding-right:.35em;white-space:pre;cursor:pointer;border-radius:4px}
.ln .c:empty{cursor:default}
.ln:not(.hc) .c{display:none}
.ln .c.inf{opacity:.6;font-style:italic}
.ln .tx{white-space:pre}
.ln.co{display:flex;flex-wrap:wrap;gap:.2em .6em;align-items:center}
.ln.co .c{min-height:0;padding:.05em .35em;background:var(--chord-bg)}
.rep{font-family:var(--f-mono);font-size:.7em;color:var(--warm);font-weight:700}
.ln.sk{display:flex;flex-wrap:wrap;align-items:center;gap:.25em .5em}
.ln.sk .c{min-height:0;padding:.05em .35em;background:var(--chord-bg)}
.ln.sk.inh .c{opacity:.55;background:transparent;border:1px dashed var(--line)}
.dots{display:inline-flex;gap:.22em;align-items:center;opacity:.6}
.dots i{width:.32em;height:.32em;border-radius:50%;background:var(--muted);display:block}
.tabtxt{font-family:var(--f-mono);font-size:.62em;line-height:1.35;white-space:pre;overflow-x:auto;background:var(--sunk);border-radius:8px;padding:.5em .7em;margin:.2em 0}
.note-sk{font-size:.7em;color:var(--muted);font-style:italic}
body.nochords .ln .c{display:none}
body.nochords .ln.co,body.nochords .sec-label.ch{display:none}
.countin{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--f-display);font-size:120px;font-weight:800;color:var(--chord);opacity:.85}
.skel-banner{margin:10px 0 14px;font-size:14px;line-height:1.4;background:var(--warm-bg);color:var(--ink);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.skel-banner b{color:var(--warm)}
.dock{border-top:1px solid var(--line);background:var(--surface);padding:8px var(--gut-r) calc(8px + env(safe-area-inset-bottom,0px)) var(--gut-l);display:flex;flex-direction:column;gap:8px}
.dock-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.stepper{display:flex;align-items:center;background:var(--sunk);border-radius:12px}
.stepper button{border:0;background:none;width:42px;height:46px;font-size:22px;font-weight:700;color:var(--ink)}
.stepper .val{min-width:58px;text-align:center;line-height:1.05}
.stepper .val b{font-family:var(--f-mono);font-size:17px;color:var(--chord);display:block}
.stepper .val small{font-size:11px;color:var(--muted)}
.play{width:54px;height:54px;border-radius:50%;border:0;background:var(--chord);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:26px;height:26px}
.capobtn{border:0;border-radius:12px;background:var(--sunk);height:46px;padding:0 12px;text-align:left;line-height:1.1;min-width:0}
.capobtn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.capobtn small{font-size:11px;color:var(--muted)}
.capobtn.hint{background:var(--warm-bg)}
.capobtn.hint small{color:var(--warm);font-weight:700}
.speed{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.speed input{flex:1;accent-color:var(--chord)}
.speed output{font-family:var(--f-mono);color:var(--ink);min-width:48px;text-align:right}

/* ---------- Hoja inferior ---------- */
#sheetwrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px var(--gut-r) calc(18px + env(safe-area-inset-bottom,0px)) var(--gut-l);display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px}
.sheet h3{font-size:20px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:left;width:100%;color:var(--ink);text-decoration:none}
.opt[aria-pressed="true"]{border-color:var(--chord);background:var(--chord-bg)}
.opt .grow b{display:block}
.opt .grow small{color:var(--muted)}
.diff{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px}
.diff.d1{background:var(--ok-bg);color:var(--ok)}
.diff.d2{background:var(--warm-bg);color:var(--warm)}
.diff.d3{background:color-mix(in srgb, var(--danger) 14%, transparent);color:var(--danger)}
.shapes{display:flex;flex-wrap:wrap;gap:4px}
.shapes span{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--chord);background:var(--chord-bg);border-radius:6px;padding:1px 6px}

/* ---------- Diagramas ---------- */
.diagrams{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.dg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.dg button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
.dg .nm{font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--chord)}
.dg svg{width:100%;max-width:110px;height:auto}
.dg small{font-size:11px;color:var(--muted)}
.dg .kind{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2;padding:0 2px}
.dgstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.dgstrip .dg{flex:0 0 108px}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;white-space:nowrap;font-size:15px;color:var(--ink)}
.pick[aria-pressed="true"]{background:var(--chord);color:#fff;border-color:var(--chord)}
.pick.mono{font-family:var(--f-mono)}

/* ---------- Escalas ---------- */
.fbwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px}
.fbwrap svg{display:block;height:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}

/* ---------- Voz / afinador ---------- */
.voicebig{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.notebig{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1;color:var(--chord);min-width:3ch}
canvas.pitch{width:100%;height:170px;background:var(--sunk);border-radius:var(--r);display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-family:var(--f-display);font-size:22px}
.reco{display:flex;flex-direction:column}
.tuner{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tuner .bignote{font-family:var(--f-display);font-size:72px;font-weight:800;line-height:1;color:var(--chord);min-height:1em}
.tuner .bignote.ok{color:var(--ok)}
.tuner .cents{font-family:var(--f-mono);font-size:16px;color:var(--muted);min-height:1.4em}
.meter{position:relative;width:100%;max-width:420px;height:46px}
.meter .track{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--danger),var(--warm) 35%,var(--ok) 47%,var(--ok) 53%,var(--warm) 65%,var(--danger))}
.meter .mid{position:absolute;left:50%;top:8px;width:2px;height:30px;background:var(--ink);transform:translateX(-50%);opacity:.6}
.meter .needle{position:absolute;top:4px;width:4px;height:38px;border-radius:2px;background:var(--ink);transform:translateX(-50%);transition:left .08s linear;left:50%}
.meter .needle.ok{background:var(--ok)}
.strings{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;max-width:420px}
.strings button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;font-family:var(--f-mono);font-weight:700;font-size:16px;color:var(--ink)}
.strings button[aria-pressed="true"]{background:var(--chord);color:#fff;border-color:var(--chord)}
.strings button.intune{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.hold{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;width:100%;max-width:420px}
.hold i{display:block;height:100%;background:var(--ok);width:0;transition:width .1s linear}
.micnote{font-size:13px;color:var(--muted);text-align:center;max-width:46ch}

/* ---------- Rasguidos / arpegios ---------- */
.pattern{display:grid;gap:4px;width:100%}
.pattern .cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:10px;background:var(--sunk);font-family:var(--f-mono);font-weight:700;position:relative;min-width:0}
.pattern .cell .sym{font-size:22px;line-height:1}
.pattern .cell .sym.up{color:var(--chord)}
.pattern .cell .sym.mute{color:var(--muted)}
.pattern .cell .sym.bass{color:var(--warm)}
.pattern .cell .sym.rest{color:var(--line)}
.pattern .cell .ct{font-size:11px;color:var(--muted)}
.pattern .cell.acc{box-shadow:inset 0 0 0 2px var(--warm)}
.pattern .cell.now{background:var(--now);outline:2px solid var(--chord)}
.pattern .cell.beat{border-top:3px solid var(--line)}
.patlist{display:flex;flex-direction:column;gap:8px}
.pat{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:left;width:100%;color:var(--ink)}
.pat b{display:block;font-family:var(--f-display);font-size:16px}
.pat small{color:var(--muted);font-size:13px}
.pat .mini{font-family:var(--f-mono);font-size:13px;color:var(--chord);letter-spacing:.08em;white-space:nowrap}
.bpm{display:flex;align-items:center;gap:8px}
.bpm b{font-family:var(--f-mono);font-size:18px;min-width:4ch;text-align:center}
.arprow{display:grid;gap:4px;width:100%}
.arprow .cell .fg{font-size:12px;color:var(--warm)}

/* ---------- Editor de canción ---------- */
.ed-lines{display:flex;flex-direction:column;gap:2px;font-size:18px;line-height:1.35}
.ed-line{display:flex;flex-wrap:wrap;gap:0 .35em;align-items:flex-end;padding:3px 4px;border-radius:8px}
.ed-line.lbl{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--warm);margin-top:10px}
.ed-w{display:inline-flex;flex-direction:column;align-items:flex-start;border:0;background:none;padding:0;color:var(--ink);font:inherit;border-radius:6px}
.ed-w .c{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--chord);min-height:1.3em;line-height:1.3;background:var(--chord-bg);border-radius:5px;padding:0 5px}
.ed-w .c:empty{background:transparent;min-height:1.3em}
.ed-w:active .tx{background:var(--now)}
.palette{position:sticky;top:0;z-index:2;background:var(--surface);padding:8px 0;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.palette .chiprow{padding:0}
.palette .pick.sel{background:var(--chord);color:#fff;border-color:var(--chord)}
.timeline{display:flex;flex-wrap:wrap;gap:6px}
.timeline .seg{display:inline-flex;flex-direction:column;align-items:center;background:var(--chord-bg);color:var(--chord);border-radius:8px;padding:4px 8px;font-family:var(--f-mono);font-weight:700;font-size:14px;min-width:52px}
.timeline .seg small{font-size:10px;color:var(--muted);font-weight:400}
.progress{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--chord);width:0;transition:width .2s}

#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center}
#toast button{border:0;background:none;color:var(--chord-bg);font-weight:700;padding:0}
.importlist{display:flex;flex-direction:column;gap:10px}
.importitem{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.importitem .full{grid-column:1/-1}
.prevbox{font-family:var(--f-mono);font-size:12px;white-space:pre;overflow:auto;max-height:180px;background:var(--sunk);border-radius:8px;padding:8px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  if(attrs) for(const k in attrs){ const v=attrs[k]; if(v==null||v===false) continue;
    if(k==='class') el.className=v; else if(k==='html') el.innerHTML=v; else if(k==='text') el.textContent=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v); else el.setAttribute(k,v===true?'':v); }
  for(const kid of kids.flat()){ if(kid==null||kid===false) continue; el.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return el;
}

const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9ñ ]+/g,' ').replace(/\s+/g,' ').trim();

/* =====================================================================
   Motor musical: notas, acordes, transposición y tonalidad
   ===================================================================== */
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const LATN={C:'Do',D:'Re',E:'Mi',F:'Fa',G:'Sol',A:'La',B:'Si'};
const NAT={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const LAT_IN={do:'C',re:'D',mi:'E',fa:'F',sol:'G',la:'A',si:'B'};

function readNote(s, english){
  if(!s) return null;
  let letter, rest, latin=false, m;
  if(!english && (m=s.match(/^(do|re|mi|fa|sol|la|si)/i)) && /^[DRMFSL]/.test(s)){ letter=LAT_IN[m[1].toLowerCase()]; rest=s.slice(m[1].length); latin=true; }
  else if(/^[A-G]/.test(s)){ letter=s[0]; rest=s.slice(1); }
  else return null;
  let pc=NAT[letter];
  const acc = rest.match(latin ? /^(##|#|♯|bb|b|♭|B(?![a-z]))/ : /^(#|♯|b|♭)/);
  if(acc){ const a=acc[1]; pc += (a==='#'||a==='♯')?1:(a==='##'?2:(a==='bb'?-2:-1)); rest=rest.slice(a.length); }
  return {pc:(pc+12)%12, rest, latin};
}
const SUF_RE=/^(?:maj|Maj|MAJ|min|mi|m|M|dim|aug|sus|add|no|omit|ø|°|º|o|\+|-|Δ|∆|[#b♯♭]|\d|\(|\)|,)*$/;
const CH_CACHE=new Map();
function parseChord(tok){
  if(tok==null) return null;
  if(CH_CACHE.has(tok)) return CH_CACHE.get(tok);
  let r=null;
  const s=String(tok).replace(/\*/g,'').trim();
  const parts=s.split('/');
  if(parts.length<=2){
    let a=readNote(parts[0]);
    // "Faug" o "Dom7" no son "Fa" ni "Do": si la lectura latina deja un sufijo inválido, se lee en inglés
    if(a && a.latin && !SUF_RE.test(a.rest) && /^[A-G]/.test(parts[0])) a=readNote(parts[0], true);
    if(a && SUF_RE.test(a.rest) && a.rest.length<10){
      let bass=null, ok=true;
      if(parts.length===2){ const b=readNote(parts[1]); if(b && b.rest==='') bass=b.pc; else ok=false; }
      if(ok) r={root:a.pc, suf:a.rest, bass, q:analyzeSuffix(a.rest), raw:s};
    }
  }
  CH_CACHE.set(tok,r);
  return r;
}
/* Analiza el sufijo y devuelve intervalos (semitonos desde la fundamental) */
function analyzeSuffix(raw){
  let s=(raw||'').replace(/[()\s,]/g,'').replace(/♯/g,'#').replace(/♭/g,'b').replace(/º/g,'°');
  let third=4, fifth=7, sev=null, sixth=false, sus=null; const ext=new Set(); let m;
  const take=re=>{ const mm=s.match(re); if(mm){ s=s.slice(mm[0].length); return mm; } return null; };
  const addExt=v=>{ if(v>=9) ext.add(14); if(v>=11) ext.add(17); if(v>=13) ext.add(21); };
  if(s==='5'){ return {iv:[0,7],third:null,fifth:7,sev:null,id:'5'}; }
  if(take(/^(maj|Maj|MAJ|Δ|∆)/) || (s[0]==='M' && take(/^M/))){ if((m=take(/^(7|9|11|13)/))){ sev=11; addExt(+m[1]); } }
  else if(take(/^(min|mi|m|-)/)){ third=3; if(take(/^(maj|Maj|M|Δ)/)){ sev=11; if((m=take(/^(7|9|11|13)/))) addExt(+m[1]); } }
  if(take(/^(dim|°|o)/)){ third=3; fifth=6; if(take(/^7/)) sev=9; }
  else if(take(/^ø7?/)){ third=3; fifth=6; sev=10; }
  else if(take(/^(aug|\+)/)){ fifth=8; }
  if((m=take(/^(69|6\/9|13|11|9|7|6)/))){ const v=m[1]; if(v==='6') sixth=true; else if(v==='69'||v==='6/9'){ sixth=true; ext.add(14); } else { if(sev==null) sev=(v==='7'||true)?10:10; if(v!=='7') addExt(+v); } }
  let guard=0;
  while(s.length && guard++<8){
    if(take(/^sus2/)) sus=2; else if(take(/^sus4?/)) sus=5;
    else if((m=take(/^add(9|11|13|2|4)/))) ext.add({9:14,11:17,13:21,2:14,4:17}[m[1]]);
    else if((m=take(/^(maj7|M7)/))) sev=11;
    else if((m=take(/^([#b+-])(5|9|11|13)/))){ const d=(m[1]==='#'||m[1]==='+')?1:-1; const n=+m[2];
      if(n===5) fifth=7+d; else { const base={9:14,11:17,13:21}[n]; ext.add(base+d); if(sev==null) sev=10; } }
    else if((m=take(/^(9|11|13)/))) addExt(+m[1]);
    else if(take(/^(no3|omit3)/)) third=null;
    else break;

  if(!s._disp){ try{ s._disp=completeSections(s.sections); }catch(e){ s._disp=s.sections; } }
  return s._disp;
}

/* Esqueleto (semilla) -> modelo, con herencia de acordes en estrofas repetidas */
function skeletonToSections(sk){
  let secs=sk.map(s=>({label:s.l||'', lines:s.ln.map(([c,syl])=>{
    if(c==='[TAB]') return {note:'Hay un riff / tablatura en la fuente.'};
    const chords=(c||'').split(/\s+/).filter(Boolean).filter(x=>/^x\d$/.test(x)||parseChord(x));
    const rep=chords.find(x=>/^x\d$/.test(x));
    return {lyric:'', chords:chords.filter(x=>!/^x\d$/.test(x)).map((x,k)=>({i:k,c:x})), syl, sk:true, rep};
  })}));
  const hasCh=s=>s.lines.some(l=>l.chords&&l.chords.length);
  while(secs.length && !hasCh(secs[0])) secs.shift();
  const done=[];
  for(const s of secs){
    if(!hasCh(s) && s.lines.some(l=>l.syl>0)){
      const sameLabel=s.label? done.find(d=>d.label===s.label && hasCh(d)) : null;
      const cand=sameLabel || [...done].reverse().find(d=>hasCh(d) && !d.inh && d.lines.length===s.lines.length && !/intro|final/i.test(d.label)) || done.find(d=>hasCh(d)&&!/intro|final/i.test(d.label));
      if(cand){ const src=cand.lines.filter(l=>l.chords&&l.chords.length);
        s.lines.forEach((l,k)=>{ if(l.sk && !(l.chords&&l.chords.length)){ const from=cand.lines[k] && cand.lines[k].chords && cand.lines[k].chords.length? cand.lines[k] : src[k%src.length]; l.chords=from.chords.map(c=>({...c})); l.inh=true; } });
        s.inh=true; }
    }
    done.push(s);
  }
  return secs;
}

   Estado: biblioteca, preferencias, sincronización
   ===================================================================== */
const GENRES=['Folklore','Infantil','Rock nacional','Pop','Canción de autor','Cuarteto','Cumbia','Tango','Otro'];
const TEMPO={ lento:{spb:0.46, chord:2.6}, medio:{spb:0.32, chord:1.9}, rapido:{spb:0.24, chord:1.3} };
let prefs=Object.assign({notation:'en', theme:'auto', group:'genre', countIn:3, font:20, lh:1.25, voice:null, deleted:[], autoCapo:false, updatedAt:0}, store.get('prefs',{}));
let userSongs=store.get('songs',{});
let LIB=[];
function seedToSong(s){ return {id:s.id, title:s.t, artist:s.a, genre:s.g, rhythm:s.r||'', tempo:s.tempo||'medio', alias:s.alias||'', source:s.src||null, key:s.k, kind:'skeleton', sections:skeletonToSections(s.sk), seed:true, user:s.cp?{transpose:s.cp, capo:s.cp}:{}}; }
function buildLibrary(){
  const map=new Map();
  for(const s of SEED){ if(prefs.deleted.includes(s.id)) continue; map.set(s.id, seedToSong(s)); }
  for(const id in userSongs){ const u=userSongs[id];
    if(!u || u._deleted){ map.delete(id); continue; }
    // una canción cargada con el id de una del cancionero conserva título, género y fuente de esa
    const sd=SEED.find(x=>x.id===id); const base=map.get(id) || (sd? seedToSong(sd) : null);
    if(base && u!==base){ map.set(id, Object.assign(base, u, {user:Object.assign({}, base.user, u.user||{})})); }
    else map.set(id, Object.assign({title:'Sin título', artist:'', genre:'Otro', tempo:'medio', user:{}}, u)); }
  LIB=[...map.values()];
  LIB.forEach(s=>{ s.user=s.user||{}; s._chords=null; s._disp=null; s._key=null; });
}
function songChordList(s){ if(s._chords) return s._chords; const L=[]; for(const sec of s.sections) for(const l of sec.lines) for(const c of (l.chords||[])){ const p=parseChord(c.c); if(p) L.push(p); } s._chords=L; return L; }
function songKey(s){ if(s._key!==null && s._key!==undefined) return s._key; let k=null;
  if(s.key){ const p=parseChord(s.key); if(p) k={pc:p.root, minor:p.q.third===3}; }
  if(!k) k=detectKey(songChordList(s), sectionEnds(s.sections)); s._key=k; return k; }
function saveSong(s, quiet){
  s.updatedAt=Date.now();
  const copy=JSON.parse(JSON.stringify(s, (k,v)=>k.startsWith('_')?undefined:v));
  userSongs[s.id]=copy; store.set('songs',userSongs); Cloud.queue(s.id); GSync.queue();
  if(!quiet) toast('Guardado');
}
function savePrefs(){ prefs.updatedAt=Date.now(); store.set('prefs',prefs); Cloud.queue('prefs'); GSync.queue(); }
function deleteSong(s){
  if(s.seed){ prefs.deleted.push(s.id); savePrefs(); }
  userSongs[s.id]={_deleted:true, updatedAt:Date.now()}; store.set('songs',userSongs); Cloud.queue(s.id); GSync.queue();
  buildLibrary();
}
/* Fusiona canciones de otro dispositivo: gana la versión más nueva de cada una (las borradas también cuentan) */
function mergeSongs(remote){
  let changed=0;
  for(const id in remote){ const r=remote[id]; if(!r) continue; const loc=userSongs[id];
    if(!loc || (r.updatedAt||0)>(loc.updatedAt||0)){ userSongs[id]=r; changed++; if(r._deleted && !prefs.deleted.includes(id) && SEED.some(x=>x.id===id)) prefs.deleted.push(id); if(!r._deleted) prefs.deleted=prefs.deleted.filter(x=>x!==id); } }
  if(changed) store.set('songs',userSongs);
  return changed;
}

/* =====================================================================
   Sincronización entre dispositivos con un Gist privado de GitHub.
   El token lo pegás una vez en cada dispositivo (Ajustes). Al abrir la app
   baja lo del otro dispositivo; cada cambio se sube a los pocos segundos.
   ===================================================================== */
const GSync={
  FILE:'cancionero-sync.json', DESC:'Cancionero de Guitarra · sincronización (archivo generado por la app)',
  timer:null, busy:false, status:'', lastOk:0,
  cfg(){ try{ return JSON.parse(localStorage.getItem('cancionero:gh')||'null'); }catch(e){ return null; } },
  save(c){ try{ if(c) localStorage.setItem('cancionero:gh', JSON.stringify(c)); else localStorage.removeItem('cancionero:gh'); }catch(e){} },
  enabled(){ const c=this.cfg(); return !!(c && c.token); },
  headers(token){ return {'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}; },
  payload(){ return JSON.stringify({app:'cancionero', v:1, date:new Date().toISOString(), songs:userSongs, deleted:prefs.deleted, voice:prefs.voice||null}); },
  async connect(token){
    token=String(token||'').trim(); if(!token) throw new Error('Pegá el token');
    const r=await fetch('https://api.github.com/gists?per_page=100',{headers:this.headers(token)});
    if(r.status===401) throw new Error('GitHub no aceptó ese token. Revisá que tenga el permiso "gist".');
    if(!r.ok) throw new Error('GitHub respondió '+r.status);
    const list=await r.json(); let g=list.find(x=>x.files && x.files[this.FILE]);
    if(!g){ const c=await fetch('https://api.github.com/gists',{method:'POST',headers:this.headers(token),body:JSON.stringify({description:this.DESC, public:false, files:{[this.FILE]:{content:this.payload()}}})});
      if(!c.ok) throw new Error('No pude crear el archivo de sincronización ('+c.status+'). El token necesita permiso para crear gists.'); g=await c.json(); }
    this.save({token, gist:g.id}); this.status='conectado';
    await this.pull(); this.queue(0);
  },
  disconnect(){ this.save(null); this.status=''; },
  async pull(){
    const c=this.cfg(); if(!c) return 0;
    const r=await fetch('https://api.github.com/gists/'+c.gist,{headers:this.headers(c.token), cache:'no-store'});
    if(r.status===404){ this.save({token:c.token}); return this.connect(c.token); }
    if(!r.ok) throw new Error('GitHub respondió '+r.status);
    const g=await r.json(); const f=g.files && g.files[this.FILE]; if(!f) return 0;
    let txt=f.content; if(f.truncated){ txt=await (await fetch(f.raw_url,{cache:'no-store'})).text(); }
    const j=JSON.parse(txt||'{}'); if(j.app!=='cancionero') return 0;
    const n=mergeSongs(j.songs||{});
    if(Array.isArray(j.deleted)) for(const id of j.deleted) if(!prefs.deleted.includes(id) && !(userSongs[id] && !userSongs[id]._deleted)) prefs.deleted.push(id);
    if(j.voice && (!prefs.voice || (j.voice.date||0)>(prefs.voice.date||0))) prefs.voice=j.voice;
    store.set('prefs',prefs); this.lastOk=Date.now();
    if(n){ buildLibrary(); if(cur){ const again=LIB.find(x=>x.id===cur.id); if(again){ cur=again; renderReader(); } } else render(); }
    return n;
  },
  async push(){
    const c=this.cfg(); if(!c||!c.gist) return;
    const r=await fetch('https://api.github.com/gists/'+c.gist,{method:'PATCH',headers:this.headers(c.token),body:JSON.stringify({files:{[this.FILE]:{content:this.payload()}}})});
    if(!r.ok) throw new Error('GitHub respondió '+r.status); this.lastOk=Date.now();
  },
  queue(ms=2500){ if(!this.enabled()) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(), ms); },
  async flush(){ if(!this.enabled()||this.busy) return; this.busy=true; try{ await this.push(); this.status='sincronizado'; }catch(e){ this.status='sin conexión: se reintenta'; this.queue(20000); } this.busy=false; const el=$('#ghStatus'); if(el) el.textContent=this.statusText(); },
  statusText(){ if(!this.enabled()) return ''; return (this.status||'conectado')+(this.lastOk? ' · '+new Date(this.lastOk).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):''); },
  async init(){ if(!this.enabled()) return; try{ const n=await this.pull(); this.status='sincronizado'; if(n) toast(n===1?'1 canción nueva desde tu otro dispositivo':n+' canciones actualizadas desde tu otro dispositivo'); }catch(e){ this.status='sin conexión'; }
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ clearTimeout(this.timer); this.flush(); } else { this.pull().catch(()=>{}); } }); }
};

/* Sincronización privada con la cuenta (solo dentro de claude.ai) */
const Cloud={
  db:null, col:null, pending:new Set(), timer:null, ready:false, status:'local',
  async init(){
    try{
      if(!window.claude || !window.claude.use) return;
      const [db,user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if(!db||!user) return; const id=await user.id(); if(!id) return;
      this.db=db; this.col=db.collection('data/users/'+id);
      const snap=await this.col.get(); let changed=false;
      for(const d of snap.docs){ const data=d.data(); if(!data) continue;
        if(d.id==='prefs'){ if((data.updatedAt||0)>(prefs.updatedAt||0)){ prefs=Object.assign(prefs,data); store.set('prefs',prefs); changed=true; } continue; }
        if(d.id.startsWith('s_')){ const sid=d.id.slice(2); const loc=userSongs[sid]; if(!loc || (data.updatedAt||0)>(loc.updatedAt||0)){ userSongs[sid]=data; changed=true; } } }
      store.set('songs',userSongs);
      const cloudIds=new Set(snap.docs.map(d=>d.id));
      for(const sid in userSongs){ const loc=userSongs[sid]; const remote=snap.docs.find(d=>d.id==='s_'+sid); if(!remote || (loc.updatedAt||0)>((remote.data()||{}).updatedAt||0)) this.pending.add(sid); }
      if(!cloudIds.has('prefs')) this.pending.add('prefs');
      this.ready=true; this.status='nube';
      if(changed){ applyPrefs(); buildLibrary(); render(); }
      this.flush();
    }catch(e){ this.status='local'; }
  },
  queue(id){ if(!this.ready) return; this.pending.add(id); clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(), 1200); },
  async flush(){
    if(!this.ready) return; const ids=[...this.pending]; this.pending.clear();
    for(const id of ids){ try{
      if(id==='prefs') await this.col.doc('prefs').set(JSON.parse(JSON.stringify(prefs)));
      else { const s=userSongs[id]; if(s) await this.col.doc('s_'+id).set(s); }
    }catch(e){ if(e && e.code==='quota_exceeded') toast('La nube está llena: exportá una copia en Ajustes.'); } }
  }
};

function lineEl(l, shift, flats, used){
  const L=latin();

  const chordBtn=(c)=>{ const n=name(c); const b=h('b',{class:'c'+(c.inf?' inf':''),text:n,'data-ch':c.c}); return b; };
  if(l.note) return h('div',{class:'ln note-sk',text:l.note});
  if(l.tab) return h('div',{class:'ln'}, h('div',{class:'tabtxt',text:l.tab}));
  if(l.sk){
    const el=h('div',{class:'ln sk hc'+(l.inh?' inh':'')});
    (l.chords||[]).forEach(c=>el.append(chordBtn(c)));
    if(l.rep) el.append(h('span',{class:'rep',text:l.rep}));
    if(l.syl>0){ const d=h('span',{class:'dots',title:l.syl+' sílabas'}); for(let i=0;i<Math.min(l.syl,24);i++) d.append(h('i')); el.append(d); }
    return el;

    if(!l.chords || !l.chords.length) return h('div',{class:'ln',html:'&nbsp;'});
    const el=h('div',{class:'ln co hc'}); l.chords.forEach(c=>el.append(chordBtn(c))); if(l.rep) el.append(h('span',{class:'rep',text:l.rep})); return el;

  while((m=re.exec(lyric))) words.push({start:m.index, text:m[0], anchors:[]});
  if(!words.length) words.push({start:0,text:'',anchors:[]});
  const tail=[];

    let w=words.find(w=>c.i>=w.start && c.i<w.start+w.text.length);

}

/* Guarda sin preguntar; si coincide con una canción del cancionero, la reemplaza (conserva tono y capo) */
function quickSave(items){
  const saved=[]; const prevStates=[];
  for(const it of items){
    if(it.error || !it.sections) continue;
    const nCh=it.sections.reduce((n,s)=>n+s.lines.reduce((m,l)=>m+(l.chords||[]).length,0),0);
    if(!nCh){ toast('No encontré acordes en el texto. Revisá que estén en la línea de arriba de la letra.'); continue; }
    const match=importTarget||findMatch(it.title);
    const s= match? match : {id:uid(), user:{}, tempo:'medio', title:it.title||'Sin título', artist:artistAlias(it.artist||''), genre:guessGenre(it.artist||'')};
    prevStates.push({id:s.id, prev: match? JSON.parse(JSON.stringify(s,(k,v)=>k.startsWith('_')?undefined:v)) : null});
    if(!match){ if(!s.title||s.title==='Sin título') s.title=it.title||'Sin título'; }
    s.sections=it.sections; s.kind='full'; if(it.file) s.file=it.file;
    if(it.capo && !match){ s.user.capo=it.capo; s.user.transpose=it.capo; }
    if(it.key) s.key=it.key; else if(!match) delete s.key;
    s._chords=null; s._disp=null; s._key=null; saveSong(s,true); saved.push(s);
  }
  importTarget=null; if(!saved.length) return;
  buildLibrary(); closeSheet();
  const undo=()=>{ for(const p of prevStates){ if(p.prev){ userSongs[p.id]=p.prev; Cloud.queue(p.id); } else { delete userSongs[p.id]; Cloud.queue(p.id); } } store.set('songs',userSongs); buildLibrary(); if(cur) closeSong(); else render(); toast('Deshecho'); };
  if(saved.length===1){ const s=LIB.find(x=>x.id===saved[0].id); if(cur && cur.id===s.id){ cur=s; renderReader(); } else openSong(s); toast('Guardada', 5000, {label:'Deshacer', fn:undo}); }
  else { render(); toast(saved.length+' canciones guardadas', 5000, {label:'Deshacer', fn:undo}); }
}

async function handleFiles(files){
  const items=[]; toast('Leyendo '+files.length+' archivo'+(files.length>1?'s':'')+'…', 8000);
  for(const f of files){
    try{
      const buf=await f.arrayBuffer(); const lower=f.name.toLowerCase();
      if(lower.endsWith('.pdf')){ const rows=await pdfToText(buf); const sections=rowsToModel(rows); const fm=fileMeta(f.name);
        if(!sections.length) throw new Error('el PDF no tiene texto (¿es una foto escaneada?)');
        let hd; if(sections.header){ hd=sections.header; const extra=splitHeader(sections,true); hd.capo=hd.capo||extra.capo; } else hd=splitHeader(sections);
        if(hd.title && fm.artist && norm(hd.title)===norm(fm.artist)){ const t=fm.title; fm.title=fm.artist; fm.artist=t; }
        items.push({title:fm.title||hd.title, artist:artistAlias(fm.artist||hd.artist), sections, capo:hd.capo||0, file:f.name}); }
      else if(lower.endsWith('.docx')){ const txt=await docxToText(buf); items.push(textToImport(txt, f.name)); }
      else { const txt=new TextDecoder('utf-8').decode(buf); const parts=splitSongs(txt); if(parts.length>1) parts.forEach(p=>items.push(textToImport(p))); else items.push(textToImport(txt, f.name)); }
    }catch(e){ items.push({error:e.message||String(e), file:f.name}); }
  }

function findMatch(title){

  const exact=LIB.find(s=>norm(s.title)===n || (s.alias && norm(s.alias)===n)); if(exact) return exact;

/* ---------- Editor: escribir la letra y poner los acordes tocando las palabras ---------- */
function songToEditorText(s){
  const out=[];
  for(const sec of s.sections){ if(sec.label) out.push(sec.label+':'); for(const l of sec.lines){ if(l.lyric!=null && l.lyric!=='' && !l.co) out.push(l.lyric); else if(l.co && l.chords&&l.chords.length) out.push('['+l.chords.map(c=>c.c).join(' ')+']'); } out.push(''); }
  return out.join('\n').trim();
}
function editorTextToLines(text){
  // devuelve [{kind:'label'|'lyric'|'chords'|'blank', text}]
  return String(text).replace(/\r/g,'').split('\n').map(raw=>{ const t=raw.trim();
    if(!t) return {kind:'blank'};
    if(/^\[.*\]$/.test(t) && classifyChordTokens(tokenizeChordLine(t.slice(1,-1)))) return {kind:'chords', text:t.slice(1,-1).trim()};
    if(/^[^\s].{0,24}:$/.test(t) || (LABEL_RE.test(t) && t.replace(LABEL_RE,'').trim()==='')) return {kind:'label', text:t.replace(/:$/,'')};
    return {kind:'lyric', text:raw.replace(/\s+$/,'')}; });
}
function diatonic(k){
  if(!k) k={pc:0,minor:false};
  const M=[[0,''],[2,'m'],[4,'m'],[5,''],[7,''],[7,'7'],[9,'m'],[11,'dim']];
  const m=[[0,'m'],[2,'dim'],[3,''],[5,'m'],[7,''],[7,'7'],[8,''],[10,'']];
  const flats=prefersFlats(k.pc,k.minor);
  return (k.minor?m:M).map(([i,q])=>noteName(k.pc+i,flats,false)+q);
}

function fretboardSVG(sc, root, win, labels, flats){

  const L=latin();
  for(let st=0;st<6;st++){ const y=y0+sw*(5-st);
    for(let f=0;f<=F;f++){ const pc=(TUNING[st]+f)%12; if(!pcs.has(pc)) continue; const iv=pcs.get(pc);
      const inWin=!win || (f>=win[0] && f<=win[1]); const x= f===0? x0-16 : x0+(f-0.5)*fw;

function playScale(sc, root, win){
  const pcs=new Set(sc.iv.map(i=>(root+i)%12)); const notes=[];
  const a= win? win[0]:0, b= win? win[1]:4;

/* ---------- Mi voz: detección de tono ---------- */
const Voice={stream:null, ctx:null, an:null, raf:0, frames:[], mode:'speak', recording:false, startT:0};
function midiName(m){ const L=latin(); const pc=((Math.round(m)%12)+12)%12; return noteName(pc,false,L)+(Math.floor(Math.round(m)/12)-1); }
function yin(buf, sr){
  const n=buf.length; let rms=0; for(let i=0;i<n;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/n); if(rms<0.012) return null;
  const half=Math.floor(n/2), d=new Float32Array(half);
  for(let tau=1;tau<half;tau++){ let s=0; for(let i=0;i<half;i++){ const x=buf[i]-buf[i+tau]; s+=x*x; } d[tau]=s; }
  d[0]=1; let run=0; for(let tau=1;tau<half;tau++){ run+=d[tau]; d[tau]=run? d[tau]*tau/run : 1; }
  const minT=Math.max(2,Math.floor(sr/1000)), maxT=Math.min(half-2,Math.floor(sr/65));
  let tau=-1; for(let t=minT;t<maxT;t++){ if(d[t]<0.18){ while(t+1<maxT && d[t+1]<d[t]) t++; tau=t; break; } }
  if(tau<0) return null;
  const a=d[tau-1], b=d[tau], c=d[tau+1]; const den=a-2*b+c; const shift= den? (a-c)/(2*den) : 0;
  const f=sr/(tau+shift); if(f<65||f>1100) return null;
  return {f, clarity:1-b, rms};
}
function decimate(src, sr){ const k=Math.max(1,Math.round(sr/16000)); if(k===1) return {buf:src, sr}; const out=new Float32Array(Math.floor(src.length/k)); for(let i=0;i<out.length;i++){ let s=0; for(let j=0;j<k;j++) s+=src[i*k+j]; out[i]=s/k; } return {buf:out, sr:sr/k}; }
const toMidi=f=>69+12*Math.log2(f/440);
function analyzeVoice(frames, mode){
  const m=frames.filter(x=>x && x.clarity>0.75).map(x=>toMidi(x.f));
  if(m.length<12) return null;
  // filtro de mediana
  const sm=m.map((v,i)=>{ const w=m.slice(Math.max(0,i-2),i+3).sort((a,b)=>a-b); return w[Math.floor(w.length/2)]; });
  const sorted=[...sm].sort((a,b)=>a-b); const q=p=>sorted[Math.min(sorted.length-1,Math.max(0,Math.floor(sorted.length*p)))];
  if(mode==='speak'){ const sp=q(0.5); return {speak:sp, lo:sp-3, hi:sp+10, center:sp+3.5}; }
  // notas estables (≥ 6 cuadros dentro de medio tono)
  const stable=[]; let run=[sm[0]];
  for(let i=1;i<sm.length;i++){ if(Math.abs(sm[i]-run[0])<0.6) run.push(sm[i]); else { if(run.length>=6) stable.push(run.reduce((a,b)=>a+b)/run.length); run=[sm[i]]; } }
  if(run.length>=6) stable.push(run.reduce((a,b)=>a+b)/run.length);
  // extremos: las notas sostenidas más grave y más aguda (si no hubo notas sostenidas, percentiles)
  let L, H;
  if(stable.length>=3){ stable.sort((a,b)=>a-b); L=stable[0]; H=stable[stable.length-1]; }
  else { L=q(0.05); H=q(0.95); }
  let lo=L+1.5, hi=H-1.5; if(hi-lo<7){ lo=L; hi=H; }
  return {low:L, high:H, lo, hi, center:(lo+hi)/2};
}
function voiceType(c){ return c<51.5?'Bajo':c<55?'Barítono':c<59.5?'Tenor':c<63.5?'Contralto':c<67?'Mezzosoprano':'Soprano'; }
function saveVoiceResult(r, mode){
  const v=prefs.voice||{};
  if(mode==='speak'){ v.speak=r.speak; if(!v.sungLo){ v.lo=r.lo; v.hi=r.hi; } }
  else { v.sungLo=r.low; v.sungHi=r.high; v.lo=r.lo; v.hi=r.hi; if(v.speak){ v.lo=(r.lo*2+(v.speak-3))/3; v.hi=(r.hi*2+(v.speak+10))/3; } }
  v.center=(v.lo+v.hi)/2; v.type=voiceType(v.center); v.date=Date.now();
  prefs.voice=v; savePrefs();

/* El tono original le queda cómodo a quien la grabó: corremos la canción la diferencia
   entre tu zona cómoda y la de esa voz (a la octava más cercana), y entre opciones parecidas

const VOICE_CENTER={m:56, f:64};

function fftInPlace(re, im){

    for(let i=0;i<n;i+=len){ let cr=1, ci=0; for(let k=0;k<len/2;k++){ const a=i+k, b=a+len/2; const tr=re[b]*cr-im[b]*ci, ti=re[b]*ci+im[b]*cr; re[b]=re[a]-tr; im[b]=im[a]-ti; re[a]+=tr; im[a]+=ti; const nr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=nr; } } }
}

  }
  // plantillas: 12 mayores, 12 menores, 12 séptimas, 12 menores 7
  const T=[]; const add=(suf,iv,w)=>{ for(let r=0;r<12;r++){ const t=new Float32Array(12); iv.forEach((i,k)=>t[(r+i)%12]=w[k]); T.push({name:SH[r]+suf, t}); } };
  add('',[0,4,7],[1,0.85,0.85]); add('m',[0,3,7],[1,0.85,0.85]); add('7',[0,4,7,10],[1,0.8,0.8,0.7]); add('m7',[0,3,7,10],[1,0.8,0.8,0.7]);
  const S=T.length; const emis=chroma.map(c=>{ const cn=Math.hypot(...c)||1; return T.map(({t,name})=>{ let d=0; for(let i=0;i<12;i++) d+=c[i]*t[i]; const sim=d/(cn*Math.hypot(...t)); return sim-(/7/.test(name)?0.05:0); }); });
  // Viterbi: penaliza cambiar de acorde (los acordes duran varios cuadros)
  const P=0.35; let prev=emis[0].map(e=>e); const back=[];
  for(let f=1;f<frames;f++){ const bestPrev=Math.max(...prev); const bi=prev.indexOf(bestPrev); const cur=new Array(S), bp=new Int16Array(S);
    for(let s=0;s<S;s++){ const stay=prev[s]+emis[f][s]; const sw=bestPrev-P+emis[f][s]; if(stay>=sw){ cur[s]=stay; bp[s]=s; } else { cur[s]=sw; bp[s]=bi; } }
    back.push(bp); prev=cur; if(f%200===0){ onProgress && onProgress(0.8+0.15*f/frames); await new Promise(r=>setTimeout(r,0)); } }
  let s=prev.indexOf(Math.max(...prev)); const path=new Array(frames); path[frames-1]=s; for(let f=frames-2;f>=0;f--){ s=back[f][s]; path[f]=s; }
  // segmentos
  const dt=HOP/sr; const segs=[]; for(let f=0;f<frames;f++){ const nm=T[path[f]].name; const last=segs[segs.length-1]; if(last && last.c===nm) last.end=(f+1)*dt; else segs.push({c:nm, start:f*dt, end:(f+1)*dt}); }
  // silencio inicial/final: quitar segmentos con muy poca energía
  const eSorted=energy.slice().sort((a,b)=>a-b); const eThr=eSorted[Math.floor(eSorted.length*0.1)]*1.5;
  const segsF=segs.filter(sg=>{ const a=Math.floor(sg.start/dt), b=Math.max(a+1,Math.floor(sg.end/dt)); let m=0; for(let i=a;i<b;i++) m+=energy[i]; return m/(b-a)>eThr; });
  // tempo por autocorrelación de la energía (flujo)
  const flux=[]; for(let f=1;f<frames;f++) flux.push(Math.max(0,energy[f]-energy[f-1]));
  let bestBpm=0, bestR=-1; for(let bpm=55;bpm<=185;bpm++){ const lag=Math.round(60/bpm/dt); if(lag<1||lag>=flux.length/2) continue; let r=0; for(let i=lag;i<flux.length;i++) r+=flux[i]*flux[i-lag]; r/=(flux.length-lag); if(r>bestR){ bestR=r; bestBpm=bpm; } }
  onProgress && onProgress(1);
  return {segs:segsF, bpm:bestBpm, duration:ab.duration};
}
function simplifySegs(segs, bpm){
  const minDur=Math.max(0.7, Math.min(1.5, bpm? 60/bpm : 1)); const out=[];
  for(const sg of segs){ const p=parseChord(sg.c); const simple=simplifyChord(p); const nm=simple? chordName(simple,0,false,false) : sg.c;
    const last=out[out.length-1]; if(last && last.c===nm){ last.end=sg.end; continue; }
    if(sg.end-sg.start<minDur && last){ last.end=sg.end; continue; }
    out.push({c:nm, start:sg.start, end:sg.end}); }
  // un segundo pase: unir vecinos iguales que quedaron separados
  const m=[]; for(const sg of out){ const last=m[m.length-1]; if(last && last.c===sg.c) last.end=sg.end; else m.push({...sg}); } return m;
}
function segsToSong(segs, title, artist, bpm){
  const sections=[]; let sec={label:'',lines:[]}; let lineChords=[]; let lineStart=null;
  const flushLine=()=>{ if(lineChords.length){ sec.lines.push({lyric:'', chords:lineChords.map((c,k)=>({i:k,c:c.c})), co:true, t:lineStart}); lineChords=[]; lineStart=null; } };
  segs.forEach((sg,i)=>{ if(lineStart==null) lineStart=sg.start; lineChords.push(sg); if(lineChords.length>=4) flushLine();
    if(sec.lines.length>=4){ flushLine(); sec.label=fmtTime(sec.lines[0].t||0); sections.push(sec); sec={label:'',lines:[]}; } });
  flushLine(); if(sec.lines.length){ sec.label=fmtTime(sec.lines[0].t||0); sections.push(sec); }
  return {id:uid(), title, artist, genre:'Otro', tempo: bpm>125?'rapido':bpm<80?'lento':'medio', kind:'full', sections, user:{}, detected:true, bpm};
}
function openDetect(){
  openSheet('Acordes desde audio', sh=>{
    sh.append(h('p',{class:'lead'},'Elegí un archivo de audio (mp3, m4a, wav) o un video del celular. La app analiza la armonía y arma dos versiones: la completa (con séptimas) y una simplificada con los acordes básicos y el capo más cómodo. La letra no se transcribe: la agregás después con "Editar".'));
    sh.append(h('p',{class:'muted',style:'font-size:13px;margin:0'},'Para una canción de YouTube: descargá el audio con la herramienta que uses y elegí ese archivo acá. Las detecciones automáticas tienen errores en cambios rápidos y en grabaciones con mucha voz: revisá el resultado escuchando.'));
    const prog=h('div',{class:'progress',hidden:true},h('i',{id:'detProg'}));
    const out=h('div',{class:'stack'});
    sh.append(h('button',{class:'btn primary big block',onclick:()=>{ $('#songAudioIn').value=''; $('#songAudioIn').click(); }},'Elegir archivo'), prog, out);
    Detect.onFile=async file=>{
      if(Detect.busy) return; Detect.busy=true; prog.hidden=false; out.innerHTML='';
      try{
        const res=await analyzeSongAudio(file, p=>{ $('#detProg').style.width=Math.round(p*100)+'%'; });
        Detect.busy=false; prog.hidden=true;
        if(!res.segs.length){ out.append(h('p',{class:'muted'},'No encontré acordes claros en ese audio.')); return; }
        const full=res.segs.filter(s=>s.end-s.start>0.35); const simple=simplifySegs(res.segs, res.bpm);
        const key=detectKey(simple.flatMap(s=>{ const n=Math.max(1,Math.round((s.end-s.start)/2)); return Array(n).fill(parseChord(s.c)); }));
        const capo=capoOptions(simple.map(s=>parseChord(s.c)),0)[0];
        const base=file.name.replace(/\.[a-z0-9]+$/i,'').replace(/[_\-]+/g,' ').trim();
        const ti=h('input',{class:'box',value:titleCase(base),placeholder:'Título'}); const ar=h('input',{class:'box',placeholder:'Artista'});
        out.append(h('div',{class:'row'}, h('span',{class:'chip key'},'Tono: '+(key?keyName(key,0,latin()):'?')), h('span',{class:'chip'},'≈ '+res.bpm+' bpm'), h('span',{class:'chip'},fmtTime(res.duration)), capo.capo? h('span',{class:'chip warm'},'capo '+capo.capo+' sugerido'):null));
        out.append(h('div',{class:'grid2'}, h('label',{class:'field'},'Título',ti), h('label',{class:'field'},'Artista',ar)));
        const tl=h('div',{class:'timeline'}); simple.forEach(sg=>tl.append(h('span',{class:'seg'},(()=>{ const p=parseChord(sg.c); return p?chordName(p,0,key?prefersFlats(key.pc,key.minor):false,latin()):sg.c; })(),h('small',{text:fmtTime(sg.start)}))));
        out.append(h('div',null,h('div',{class:'muted',style:'font-size:13px;margin-bottom:6px'},'Versión simplificada ('+simple.length+' cambios)'), tl));
        const tl2=h('div',{class:'timeline'}); full.forEach(sg=>tl2.append(h('span',{class:'seg'},sg.c,h('small',{text:fmtTime(sg.start)}))));
        out.append(h('details',null,h('summary',{class:'muted',style:'font-size:13px;cursor:pointer'},'Versión completa ('+full.length+' cambios)'), h('div',{style:'margin-top:6px'},tl2)));
        const save=(segs,label)=>{ const s=segsToSong(segs, (ti.value.trim()||'Sin título')+(label?' ('+label+')':''), ar.value.trim(), res.bpm); if(key) s.key=keyName(key,0,false); if(label==='simplificada' && capo.capo){ s.user.capo=capo.capo; } saveSong(s,true); buildLibrary(); closeSheet(); openSong(LIB.find(x=>x.id===s.id)); toast('Guardada. Agregá la letra desde ⋯ → Editar.'); };
        out.append(h('div',{class:'row'}, h('button',{class:'btn primary big grow',onclick:()=>save(simple,'simplificada')},'Guardar simplificada'), h('button',{class:'btn big grow',onclick:()=>save(full,'completa')},'Guardar completa')));
      }catch(e){ Detect.busy=false; prog.hidden=true; out.append(h('p',{class:'muted'},'No pude leer ese archivo. Probá con mp3, m4a o wav.')); }
    };
  });
}

}

      } };
    drawGh(); sh.append(ghCard);
    // atajos para capturar canciones de páginas web
    const appUrl=location.origin+location.pathname;
    const bm="javascript:(function(){var P=[].slice.call(document.querySelectorAll('pre,#t_body,.cifra_cnt,.cifra,.letra,.chords,.tab-content,article'));var best='',bs=0;P.forEach(function(p){var t=(p.innerText||'').trim();if(t.length<40)return;var s=(t.match(/(^|\\s)[A-G](#|b)?(m|maj|min|dim|aug|sus|add|M)?\\d?(\\/[A-G](#|b)?)?(?=\\s|$)/g)||[]).length*5+Math.min(t.length,4000)/200;if(s>bs){bs=s;best=t;}});var sel=String(window.getSelection&&window.getSelection());if(sel.length>60)best=sel;if(!best){alert('No encontré la canción en esta página. Seleccioná el texto con los acordes y volvé a tocar el atajo.');return;}var h1=document.querySelector('h1');var title=(h1&&h1.innerText.trim())||document.title.split(/[|\\-–:]/)[0].trim();var a=document.querySelector('h2 a, h2, .artist, .t1 a, [itemprop=byArtist], .autor');var artist=a?a.innerText.trim():'';var txt=title+'\\n'+artist+'\\n\\n'+best;window.open('"+appUrl+"#add='+encodeURIComponent(txt),'_blank');})();";
    sh.append(h('div',{class:'card stack',style:'gap:8px'}, h('b',null,'Traer canciones de una página en un toque'),
      h('p',{class:'muted',style:'margin:0;font-size:14px'},h('b',null,'En la compu: '),'arrastrá este botón a la barra de favoritos. Después, en cualquier página de acordes (LaCuerda, CifraClub, Satori…), tocá el favorito y la canción se abre guardada en la app.'),
      h('a',{class:'btn warm',href:bm,onclick:e=>{ e.preventDefault(); toast('Arrastralo a la barra de favoritos (no hace falta hacer clic)'); },draggable:'true'},'♪ Guardar en Cancionero'),
      h('p',{class:'muted',style:'margin:0;font-size:14px'},h('b',null,'En el celular: '),'en la página de la canción mantené apretado el texto, "Seleccionar todo", "Compartir" → ',h('b',null,'Cancionero'),'. Se guarda sola (hace falta tener la app instalada).')));
    sh.append(h('div',{class:'card'},h('b',null,'Copia de seguridad'),

        prefs.deleted.length? h('button',{class:'btn small ghost',onclick:()=>{ prefs.deleted=[]; savePrefs(); for(const id in userSongs) if(userSongs[id]._deleted) delete userSongs[id]; store.set('songs',userSongs); buildLibrary(); render(); closeSheet(); toast('Canciones de ejemplo restauradas'); }},'Restaurar borradas'):null)));
    if(installPrompt) sh.append(h('button',{class:'btn primary block',onclick:async()=>{ installPrompt.prompt(); try{ await installPrompt.userChoice; }catch(e){} installPrompt=null; closeSheet(); }},'Instalar en este dispositivo'));
    sh.append(h('p',{class:'muted',style:'font-size:12px;margin:0'},'Acordes de las canciones de ejemplo elegidos por votos en LaCuerda.net. Las letras no vienen incluidas: se agregan desde tus archivos o pegando el texto.'));
  });
}
async function exportBackup(){
  const data=JSON.stringify({app:'cancionero', v:1, date:new Date().toISOString(), prefs, songs:userSongs});
  const fname='cancionero-copia-'+new Date().toISOString().slice(0,10)+'.json';
  try{ if(window.claude && window.claude.use){ const dl=await window.claude.use('downloads'); if(dl){ await dl.save({filename:fname, data}); toast('Copia exportada'); return; } } }catch(e){ if(e && e.code==='declined') return; }
  try{ const a=h('a',{href:URL.createObjectURL(new Blob([data],{type:'application/json'})),download:fname}); document.body.append(a); a.click(); a.remove(); }catch(e){ toast('No se pudo exportar en este navegador'); }
}
async function importBackup(file){
  try{ const j=JSON.parse(await file.text()); if(j.app!=='cancionero') throw 0;
    for(const id in j.songs){ const s=j.songs[id]; const loc=userSongs[id]; if(!loc || loc._deleted || (s.updatedAt||0)>(loc.updatedAt||0)){ userSongs[id]=s; prefs.deleted=prefs.deleted.filter(x=>x!==id); Cloud.queue(id); } }
    store.set('songs',userSongs); savePrefs(); if(j.prefs){ const keep=prefs.voice; prefs=Object.assign(prefs,j.prefs); if(!prefs.voice) prefs.voice=keep; savePrefs(); applyPrefs(); }
    buildLibrary(); render(); closeSheet(); toast('Copia importada');
  }catch(e){ toast('Ese archivo no es una copia del cancionero'); }
}

/* Canción recibida desde el atajo del navegador (#add=…) o desde "Compartir" del celular (?text=…) */
function handleIncoming(){
  try{
    let txt=null; const q=new URLSearchParams(location.search);
    if(q.get('text') || q.get('title')){ txt=[q.get('title')||'', q.get('text')||'', q.get('url')||''].join('\n'); }
    const m=location.hash.match(/^#add=(.+)$/); if(m){ try{ txt=decodeURIComponent(m[1]); }catch(e){ txt=m[1]; } }
    if(!txt) return;
    history.replaceState(null,'',location.pathname);
    if(txt.trim().length>40){ const parts=splitSongs(txt); setTimeout(()=>quickSave((parts.length?parts:[txt]).map(p=>textToImport(p))), 150); }
    else toast('Lo que llegó no tenía letra con acordes. Seleccioná el texto de la canción antes de compartir.', 5000);
  }catch(e){}
}
